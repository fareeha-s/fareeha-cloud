  <circle cx="37" cy="87" r="9" fill="#5b2b31"/>
  <circle cx="37" cy="87" r="3.5" fill="#fff" opacity="0.8"/>
  <circle cx="83" cy="87" r="9" fill="#5b2b31"/>
  <circle cx="83" cy="87" r="3.5" fill="#fff" opacity="0.8"/>
