    <path d="M40 44h40c5 0 8 3 10 7l6 12c4 1 7 4 7 9v10c0 3-2 5-5 5H22c-3 0-5-2-5-5V72c0-5 3-8 7-9l6-12c2-4 5-7 10-7z"/>
